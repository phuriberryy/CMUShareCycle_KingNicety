server {
    server_name app2.turnpro.dev;

    # Increase upload size to 50MB to handle multiple large images (base64 JSON)
    client_max_body_size 50M;

    # ── Frontend (React SPA via serve -s build) ────────────────────────────
    location / {
        proxy_pass http://localhost:3001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # ── /ws — CRA HMR WebSocket (dev mode) / serve fallback ───────────────
    location /ws {
        proxy_pass http://localhost:3001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;

        proxy_read_timeout 86400s;
        proxy_buffering    off;
    }

    # ── Socket.IO — real-time chat WebSocket ──────────────────────────────
    location /socket.io/ {
        proxy_pass http://localhost:4000/socket.io/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO keep-alive: pingTimeout(60s) + pingInterval(25s) = 85s.
        # Set slightly above to survive Cloudflare/proxy 100s timeout.
        proxy_read_timeout  90s;
        proxy_send_timeout  90s;
        proxy_buffering     off;
    }

    # ── Backend REST API ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://localhost:4000/api/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }

    # ── Static uploaded files (chat images) ──────────────────────────────
    location /uploads/ {
        proxy_pass http://localhost:4000/uploads/;
        proxy_read_timeout 10s;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app2.turnpro.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app2.turnpro.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = app2.turnpro.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name app2.turnpro.dev;
    return 404;
}
