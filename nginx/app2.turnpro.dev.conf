# /etc/nginx/sites-available/app2.turnpro.dev
# Deploy: sudo ln -sf /path/to/this/file /etc/nginx/sites-enabled/app2.turnpro.dev
#         sudo nginx -t && sudo systemctl reload nginx

# ─── Upstreams ────────────────────────────────────────────────────────────────
upstream frontend {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name app2.turnpro.dev;
    return 301 https://$host$request_uri;
}

# ─── Main HTTPS server ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app2.turnpro.dev;

    # ── TLS (Let's Encrypt / certbot) ─────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/app2.turnpro.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app2.turnpro.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ── Cloudflare: trust forwarded headers from CF IPs only ──────────────
    # (Cloudflare publishes its IP ranges; these cover the current ranges)
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header    CF-Connecting-IP;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # ── Upload size (must match backend multer limit: 10 MB) ─────────────
    client_max_body_size 10m;

    # ── Common proxy headers (applied via snippet) ────────────────────────
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;

    # ─────────────────────────────────────────────────────────────────────────
    # /socket.io/ — MUST come before /api/ to avoid prefix-match collision.
    # Requires WebSocket upgrade headers so socket.io can upgrade from
    # HTTP long-polling to a real WebSocket connection.
    # Without these headers the upgrade silently fails and the client
    # stays on polling — high latency and messages can be lost under load.
    # ─────────────────────────────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass          http://backend;

        # WebSocket upgrade — critical for socket.io
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";

        # Keep connection alive through Cloudflare's 100-second proxy timeout.
        # socket.io pingInterval=25s, pingTimeout=60s → needs > 85s here.
        proxy_read_timeout  90s;
        proxy_send_timeout  90s;

        # Disable buffering for real-time streaming
        proxy_buffering     off;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # /api/ — Express REST API
    # ─────────────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass          http://backend/api/;
        proxy_read_timeout  30s;
        proxy_send_timeout  30s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # /uploads/ — Multer-uploaded chat images (served by Express static)
    # ─────────────────────────────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass          http://backend/uploads/;
        proxy_read_timeout  10s;
        # Long cache — filenames are random hex, content never changes
        add_header          Cache-Control "public, max-age=31536000, immutable";
    }

    # ─────────────────────────────────────────────────────────────────────────
    # /ws — CRA webpack dev-server HMR WebSocket (only needed when running
    # `npm run dev` in development; harmless to include in production).
    # Without this, the browser tries wss://domain:3001/ws (port 3001 direct)
    # which is blocked externally → "WebSocket connection failed" in console.
    # ─────────────────────────────────────────────────────────────────────────
    location /ws {
        proxy_pass          http://frontend;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_read_timeout  86400s;
        proxy_buffering     off;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # / — React SPA
    #   • Dev mode  (npm run dev / craco start on port 3001): proxy to dev server
    #   • Prod mode (serve -s build on port 3001)           : proxy to serve
    # Both cases: the upstream handles SPA routing; 404 from upstream means
    # we fall through. In pure-static mode you'd use try_files instead.
    # ─────────────────────────────────────────────────────────────────────────
    location / {
        proxy_pass          http://frontend;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection $http_upgrade;
        proxy_read_timeout  30s;
    }
}
