services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - CLIENT_ORIGIN=https://app2.turnpro.dev
      - CLIENT_ORIGINS=https://app2.turnpro.dev
    volumes:
      - ./backend/.env:/app/.env:ro
      - backend_uploads:/app/uploads
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: https://app2.turnpro.dev/api
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  backend_uploads:
